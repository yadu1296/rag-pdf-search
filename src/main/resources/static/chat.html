<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Search — chat</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #d2a8ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; font-size: 15px; line-height: 1.55;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 17px; color: var(--accent); }
  header .meta { color: var(--muted); font-size: 12.5px; }
  header .conv-id { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; color: var(--muted); margin-left: 4px; }
  header .spacer { flex: 1; }
  header .upload { display: flex; align-items: center; gap: 8px; }
  header .upload label {
    cursor: pointer; padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-2); color: var(--text); font-size: 13px;
  }
  header .upload label:hover { border-color: var(--accent); color: var(--accent); }
  header .upload input[type=file] { display: none; }
  header .upload-status { font-size: 12px; color: var(--muted); }
  header .upload-status.good { color: var(--good); }
  header .upload-status.bad  { color: var(--bad); }

  .layout { display: flex; flex: 1; min-height: 0; }

  aside.sidebar {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--surface); display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 10px 14px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .sidebar-header .count { color: var(--muted); font-size: 12px; }
  .sidebar-header .icon-btn {
    margin-left: auto; cursor: pointer; background: none; border: none; color: var(--muted);
    font-size: 16px; padding: 2px 6px; border-radius: 4px;
  }
  .sidebar-header .icon-btn:hover { background: var(--surface-2); color: var(--accent); }
  .new-conv-full {
    margin: 10px 12px; padding: 8px 12px; border: 1px dashed var(--border); border-radius: 6px;
    background: transparent; color: var(--accent); font-family: inherit; cursor: pointer; font-size: 13px;
  }
  .new-conv-full:hover { border-color: var(--accent); background: var(--surface-2); }
  .conv-list { list-style: none; margin: 0; padding: 6px 8px 12px; overflow-y: auto; flex: 1; }
  .conv-item {
    padding: 10px 12px; border-radius: 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px; position: relative;
    border: 1px solid transparent; margin-bottom: 4px;
  }
  .conv-item:hover { background: var(--surface-2); }
  .conv-item.active { border-color: var(--accent); background: var(--surface-2); }
  .conv-item .q {
    font-size: 13px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-clamp: 2;
  }
  .conv-item .q.placeholder { color: var(--muted); font-style: italic; }
  .conv-item .foot {
    font-size: 11px; color: var(--muted); display: flex; gap: 8px;
  }
  .conv-item .delete {
    position: absolute; top: 8px; right: 8px; cursor: pointer; display: none;
    background: none; border: none; color: var(--muted); font-size: 14px;
    padding: 0 4px; border-radius: 4px;
  }
  .conv-item:hover .delete { display: block; }
  .conv-item .delete:hover { color: var(--bad); background: var(--bg); }
  .conv-list .empty-list {
    color: var(--muted); font-size: 12px; padding: 20px 12px; text-align: center;
  }

  section.chat-pane {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
  }
  main#messages {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 820px; padding: 12px 16px; border-radius: 10px; white-space: pre-wrap;
    border: 1px solid var(--border);
  }
  .msg.user { align-self: flex-end; background: var(--accent); color: #0d1117; border-color: var(--accent); }
  .msg.bot  { align-self: flex-start; background: var(--surface); }
  .msg.err  { align-self: flex-start; background: var(--surface); border-color: var(--bad); color: var(--bad); }
  .msg.pending { align-self: flex-start; background: var(--surface); color: var(--muted); font-style: italic; }
  .msg .answer { margin: 0; }
  .msg .footer {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap;
  }
  .msg .footer code { color: var(--accent-2); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; font-size: 11.5px; }
  .msg details { margin-top: 10px; }
  .msg details summary { cursor: pointer; color: var(--accent); font-size: 12.5px; user-select: none; outline: none; }
  .msg details .chunks { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
  .msg details .chunk { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
  .msg details .chunk .cmeta { color: var(--muted); font-size: 11px; margin-bottom: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .msg details .chunk .cmeta .score { color: var(--good); }

  form.composer {
    display: flex; gap: 10px; padding: 12px 24px;
    border-top: 1px solid var(--border); background: var(--surface);
  }
  form.composer input[type=text], form.composer input[type=number] {
    padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
  }
  form.composer input[type=text] { flex: 1; }
  form.composer input[type=number] { width: 72px; }
  form.composer input:focus { outline: none; border-color: var(--accent); }
  form.composer button {
    padding: 10px 18px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: #0d1117; font-weight: 600; cursor: pointer;
  }
  form.composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty {
    align-self: center; margin-top: 20vh;
    color: var(--muted); text-align: center; max-width: 480px;
  }
  .empty h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
  .empty kbd {
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px; font-size: 12px; font-family: inherit;
  }

  @media (max-width: 720px) {
    aside.sidebar { width: 220px; }
  }
</style>
</head>
<body>

<header>
  <h1>RAG Search</h1>
  <span class="meta">llama3.1:8b · nomic-embed-text · pgvector</span>
  <span class="conv-id" id="conv-id-label"></span>
  <span class="spacer"></span>
  <form class="upload" id="upload-form">
    <label for="pdf-file">+ Upload PDF</label>
    <input type="file" id="pdf-file" accept="application/pdf">
    <span class="upload-status" id="upload-status"></span>
  </form>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <strong>Conversations</strong>
      <span class="count" id="conv-count"></span>
      <button class="icon-btn" id="refresh-list" title="Refresh">↻</button>
    </div>
    <button type="button" id="new-conv-btn" class="new-conv-full">+ New conversation</button>
    <ul class="conv-list" id="conv-list">
      <li class="empty-list">Loading…</li>
    </ul>
  </aside>

  <section class="chat-pane">
    <main id="messages">
      <div class="empty" id="empty">
        <h2>Ask something about your indexed PDFs</h2>
        <p>Upload a PDF (top right) if you haven't ingested one yet. Then type a question below.</p>
        <p>Prior conversations appear in the sidebar — click one to continue it.</p>
      </div>
    </main>
    <form class="composer" id="chat-form" autocomplete="off">
      <input type="text" id="q" placeholder="Ask about your PDFs..." required autofocus>
      <input type="number" id="topK" min="1" max="20" value="4" title="How many chunks to retrieve">
      <button type="submit" id="send-btn">Send</button>
    </form>
  </section>
</div>

<script>
  const messagesEl   = document.getElementById('messages');
  const chatForm     = document.getElementById('chat-form');
  const qInput       = document.getElementById('q');
  const topKInput    = document.getElementById('topK');
  const sendBtn      = document.getElementById('send-btn');
  const pdfInput     = document.getElementById('pdf-file');
  const uploadStatus = document.getElementById('upload-status');
  const convIdLabel  = document.getElementById('conv-id-label');
  const newConvBtn   = document.getElementById('new-conv-btn');
  const convListEl   = document.getElementById('conv-list');
  const convCountEl  = document.getElementById('conv-count');
  const refreshListBtn = document.getElementById('refresh-list');

  let conversationId = (crypto.randomUUID && crypto.randomUUID()) || ('conv-' + Date.now());

  function updateConvLabel() { convIdLabel.textContent = 'conv: ' + conversationId.slice(0, 8) + '…'; }
  function escapeHtml(s) {
    return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'",'&#039;');
  }
  function snippet(s, n) {
    if (!s) return '';
    const flat = String(s).replace(/\s+/g, ' ').trim();
    return flat.length <= n ? flat : flat.slice(0, n) + '…';
  }
  function formatRelative(iso) {
    if (!iso) return '';
    const t = new Date(iso).getTime();
    const diff = (Date.now() - t) / 1000;
    if (diff < 60)        return Math.floor(diff) + 's ago';
    if (diff < 3600)      return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400)     return Math.floor(diff / 3600) + 'h ago';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString();
  }

  function clearChatArea(emptyText) {
    messagesEl.innerHTML = '';
    if (emptyText) {
      const el = document.createElement('div');
      el.className = 'empty';
      el.innerHTML = emptyText;
      messagesEl.appendChild(el);
    }
  }

  function append(className, html) {
    const emptyEl = messagesEl.querySelector('.empty');
    if (emptyEl) emptyEl.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + className;
    el.innerHTML = html;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function renderBotMessage(data) {
    const chunks = (data.retrievedChunks ?? []).map(c => `
      <div class="chunk">
        <div class="cmeta">
          <span class="score">score ${Number(c.score).toFixed(3)}</span>
          <span>filename: ${escapeHtml(c.filename ?? '—')}</span>
          <span>id: ${escapeHtml(c.id ?? '').slice(0, 8)}…</span>
        </div>
        <div>${escapeHtml(c.preview ?? '')}</div>
      </div>`).join('');
    return `
      <div class="answer">${escapeHtml(data.answer ?? '')}</div>
      <div class="footer">
        <span><code>topK=${data.topK}</code></span>
        <span><code>${data.latencyMs} ms</code></span>
        <span><code>${(data.retrievedChunks ?? []).length} chunks</code></span>
        <span><code>priorMsgs=${data.priorMessagesCount ?? 0}</code></span>
      </div>
      ${chunks ? `<details><summary>Show retrieved chunks</summary><div class="chunks">${chunks}</div></details>` : ''}`;
  }

  // ── Sidebar ─────────────────────────────────────────────────────────────────

  async function loadConversationList() {
    try {
      const resp = await fetch('/api/ask/conversations');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const list = await resp.json();
      renderConvList(list);
    } catch (err) {
      convListEl.innerHTML = `<li class="empty-list">Failed: ${escapeHtml(err.message)}</li>`;
      convCountEl.textContent = '';
    }
  }

  function renderConvList(list) {
    convCountEl.textContent = list.length ? `(${list.length})` : '';
    if (!list.length) {
      convListEl.innerHTML = '<li class="empty-list">No conversations yet.<br>Ask something to start one.</li>';
      return;
    }
    convListEl.innerHTML = list.map(c => {
      const q = c.firstQuestion ? snippet(c.firstQuestion, 90) : null;
      const active = c.conversationId === conversationId ? ' active' : '';
      return `
        <li class="conv-item${active}" data-id="${escapeHtml(c.conversationId)}" title="${escapeHtml(c.conversationId)}">
          <div class="q${q ? '' : ' placeholder'}">${q ? escapeHtml(q) : '(no questions yet)'}</div>
          <div class="foot">
            <span>${c.messageCount} msg</span>
            <span>${formatRelative(c.lastActivity)}</span>
          </div>
          <button class="delete" title="Delete this conversation">×</button>
        </li>`;
    }).join('');
  }

  convListEl.addEventListener('click', async (e) => {
    const delBtn = e.target.closest('.delete');
    const item = e.target.closest('.conv-item');
    if (!item) return;
    const id = item.dataset.id;

    if (delBtn) {
      e.stopPropagation();
      if (!confirm('Delete this conversation?')) return;
      try {
        await fetch('/api/ask/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
        if (id === conversationId) {
          startNewConversation(false);
        }
        loadConversationList();
      } catch (err) { /* ignore */ }
      return;
    }
    await loadConversation(id);
  });

  async function loadConversation(id) {
    conversationId = id;
    updateConvLabel();
    clearChatArea('<h2>Loading…</h2>');
    try {
      const resp = await fetch('/api/ask/conversations/' + encodeURIComponent(id));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      clearChatArea(null);
      if (!data.messages?.length) {
        clearChatArea('<h2>Empty conversation</h2><p>Ask a question below to begin.</p>');
      } else {
        data.messages.forEach(m => {
          if (m.role === 'user') append('user', escapeHtml(m.content));
          else                   append('bot',  `<div class="answer">${escapeHtml(m.content)}</div>`);
        });
      }
      loadConversationList();
      qInput.focus();
    } catch (err) {
      clearChatArea(`<h2>Error</h2><p>${escapeHtml(err.message)}</p>`);
    }
  }

  async function startNewConversation(deleteOld) {
    const oldId = conversationId;
    if (deleteOld) {
      try { await fetch('/api/ask/conversations/' + encodeURIComponent(oldId), { method: 'DELETE' }); } catch (_) { /* ignore */ }
    }
    conversationId = (crypto.randomUUID && crypto.randomUUID()) || ('conv-' + Date.now());
    updateConvLabel();
    clearChatArea('<h2>New conversation</h2><p>Ask away.</p>');
    qInput.focus();
    loadConversationList();
  }

  // ── Events ──────────────────────────────────────────────────────────────────

  newConvBtn.addEventListener('click', () => startNewConversation(false));
  refreshListBtn.addEventListener('click', loadConversationList);

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = qInput.value.trim();
    if (!q) return;
    const topK = topKInput.value || 4;

    append('user', escapeHtml(q));
    const pending = append('pending', 'Thinking…');
    qInput.value = '';
    sendBtn.disabled = true;

    try {
      const url = `/api/ask?q=${encodeURIComponent(q)}&topK=${encodeURIComponent(topK)}&conversationId=${encodeURIComponent(conversationId)}`;
      const resp = await fetch(url);
      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 200)}`);
      }
      const data = await resp.json();
      pending.className = 'msg bot';
      pending.innerHTML = renderBotMessage(data);
      loadConversationList();
    } catch (err) {
      pending.className = 'msg err';
      pending.textContent = 'Error: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      qInput.focus();
    }
  });

  pdfInput.addEventListener('change', async () => {
    const file = pdfInput.files?.[0];
    if (!file) return;
    uploadStatus.className = 'upload-status';
    uploadStatus.textContent = `Uploading ${file.name}…`;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const resp = await fetch('/api/ingest', { method: 'POST', body: fd });
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()).slice(0, 200));
      const data = await resp.json();
      uploadStatus.className = 'upload-status good';
      const replaced = data.previousChunksReplaced ?? 0;
      uploadStatus.textContent = replaced > 0
        ? `✓ ${data.filename}: replaced ${replaced} old chunk(s) with ${data.chunksStored} new`
        : `✓ ${data.filename}: ${data.chunksStored} chunk(s) stored`;
    } catch (err) {
      uploadStatus.className = 'upload-status bad';
      uploadStatus.textContent = 'Upload failed: ' + err.message;
    } finally {
      pdfInput.value = '';
    }
  });

  // ── Init ────────────────────────────────────────────────────────────────────

  updateConvLabel();
  loadConversationList();
</script>
</body>
</html>
