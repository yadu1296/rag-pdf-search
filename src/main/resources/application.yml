spring:
  application:
    name: rag-pdf-search

  datasource:
    url: jdbc:postgresql://localhost:5433/ragdb
    username: raguser
    password: ragpass
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    # Ollama (local, free) provides both chat and embeddings.
    # Needs these models pulled once:
    #   ollama pull llama3.1:8b          (~4.7 GB -- chat / answering)
    #   ollama pull nomic-embed-text     (~274 MB -- embeddings)
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text

    # Vector store: pgvector. Dimensions MUST match the embedding model.
    # nomic-embed-text produces 768-dim vectors.
    vectorstore:
      pgvector:
        initialize-schema: true         # Spring AI creates its `vector_store` table (idempotent).
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
    org.springframework.ai.ollama: DEBUG            # outbound chat + embed calls to localhost:11434
    org.springframework.ai.vectorstore.pgvector: DEBUG   # similarity search SQL + results
    com.practice.ragpdfsearch: DEBUG
